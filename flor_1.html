<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Girasol Amarillo 🌻</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #ffe680 0%, #ffb700 35%, #ff7b00 70%, #b34700 100%);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: crosshair;
  }

  /* ===== SOL BRILLANTE ===== */
  .sol {
    position: absolute;
    top: -150px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, #fff8c2 0%, #ffe066 30%, rgba(255,200,0,0.4) 55%, transparent 75%);
    border-radius: 50%;
    filter: blur(20px);
    animation: pulso 4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes pulso {
    0%, 100% { transform: translateX(-50%) scale(1);   opacity: 0.9; }
    50%      { transform: translateX(-50%) scale(1.1); opacity: 1; }
  }

  /* ===== RAYOS GIRANDO ===== */
  .rayos {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 900px;
    height: 900px;
    transform: translate(-50%, -50%);
    background: conic-gradient(
      from 0deg,
      transparent 0deg,   rgba(255,230,100,0.25) 5deg,   transparent 10deg,
      transparent 30deg,  rgba(255,230,100,0.25) 35deg,  transparent 40deg,
      transparent 60deg,  rgba(255,230,100,0.25) 65deg,  transparent 70deg,
      transparent 90deg,  rgba(255,230,100,0.25) 95deg,  transparent 100deg,
      transparent 120deg, rgba(255,230,100,0.25) 125deg, transparent 130deg,
      transparent 150deg, rgba(255,230,100,0.25) 155deg, transparent 160deg,
      transparent 180deg, rgba(255,230,100,0.25) 185deg, transparent 190deg,
      transparent 210deg, rgba(255,230,100,0.25) 215deg, transparent 220deg,
      transparent 240deg, rgba(255,230,100,0.25) 245deg, transparent 250deg,
      transparent 270deg, rgba(255,230,100,0.25) 275deg, transparent 280deg,
      transparent 300deg, rgba(255,230,100,0.25) 305deg, transparent 310deg,
      transparent 330deg, rgba(255,230,100,0.25) 335deg, transparent 340deg,
      transparent 360deg
    );
    border-radius: 50%;
    opacity: 0.6;
    animation: girar 60s linear infinite;
    pointer-events: none;
  }
  @keyframes girar {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to   { transform: translate(-50%, -50%) rotate(360deg); }
  }

  /* ===== CONTENEDOR DEL GIRASOL ===== */
  .girasol {
    position: relative;
    width: min(420px, 90vmin);
    height: min(620px, 130vmin);
    z-index: 2;
    animation: balanceo 4s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes balanceo {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(2deg); }
  }
  .girasol svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 15px 40px rgba(80,30,0,0.5));
    overflow: visible;
  }

  /* ===== PÉTALOS RESPIRANDO ===== */
  .petalos {
    transform-origin: 0 0;
    animation: respirar 5s ease-in-out infinite;
  }
  @keyframes respirar {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }

  /* ===== CENTRO GIRANDO ===== */
  .centro {
    transform-origin: 0 0;
    animation: girarCentro 40s linear infinite;
  }
  @keyframes girarCentro {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ===== HOJAS ===== */
  .hoja-izq {
    transform-origin: 210px 480px;
    animation: hojaIzq 3.5s ease-in-out infinite;
  }
  @keyframes hojaIzq {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-6deg); }
  }
  .hoja-der {
    transform-origin: 210px 520px;
    animation: hojaDer 4s ease-in-out infinite;
  }
  @keyframes hojaDer {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(6deg); }
  }

  /* ===== TÍTULO ===== */
  .titulo {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;
    color: #fff;
    font-size: clamp(16px, 3vw, 22px);
    font-weight: 600;
    letter-spacing: clamp(4px, 1vw, 8px);
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(255,180,0,0.9), 0 4px 10px rgba(0,0,0,0.4);
    z-index: 5;
    pointer-events: none;
  }

  /* ===== ABEJA QUE SIGUE EL MOUSE ===== */
  .abeja {
    position: fixed;
    top: 0;
    left: 0;
    font-size: clamp(26px, 4.5vw, 36px);
    z-index: 100;
    pointer-events: none;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35))
            drop-shadow(0 0 12px rgba(255,220,100,0.6));
    will-change: transform;
    transform: translate(-50%, -50%);
    transition: none;
  }
  /* Sombra/aura de la abeja */
  .abeja::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 50px; height: 50px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,220,100,0.35) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    animation: pulsoAbeja 1.2s ease-in-out infinite;
  }
  @keyframes pulsoAbeja {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
    50%      { transform: translate(-50%, -50%) scale(1.3); opacity: 0.3; }
  }

  /* ===== POLEN ===== */
  .polen {
    position: absolute;
    width: 8px;
    height: 8px;
    background: radial-gradient(circle, #fff8c2, #ffd000);
    border-radius: 50%;
    box-shadow: 0 0 10px #ffcc00;
    opacity: 0.9;
    pointer-events: none;
  }
  .p1  { top: 30%; left: 15%; animation: flotar1 8s  ease-in-out infinite; }
  .p2  { top: 60%; left: 25%; animation: flotar2 10s ease-in-out infinite; }
  .p3  { top: 20%; left: 70%; animation: flotar3 9s  ease-in-out infinite; }
  .p4  { top: 55%; left: 80%; animation: flotar1 11s ease-in-out infinite; }
  .p5  { top: 70%; left: 45%; animation: flotar2 7s  ease-in-out infinite; }
  .p6  { top: 40%; left: 55%; animation: flotar3 12s ease-in-out infinite; }
  .p7  { top: 15%; left: 40%; animation: flotar1 9s  ease-in-out infinite; }
  .p8  { top: 65%; left: 10%; animation: flotar2 10s ease-in-out infinite; }
  .p9  { top: 25%; left: 90%; animation: flotar3 8s  ease-in-out infinite; }
  .p10 { top: 75%; left: 65%; animation: flotar1 11s ease-in-out infinite; }

  @keyframes flotar1 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.9; }
    50%      { transform: translate(30px, -40px) scale(1.4); opacity: 0.4; }
  }
  @keyframes flotar2 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.7; }
    50%      { transform: translate(-40px, -30px) scale(1.3); opacity: 0.3; }
  }
  @keyframes flotar3 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.8; }
    50%      { transform: translate(20px, 40px) scale(1.5); opacity: 0.4; }
  }

  /* ===== NUBES ===== */
  .nube {
    position: absolute;
    background: rgba(255,255,255,0.35);
    border-radius: 100px;
    filter: blur(10px);
    pointer-events: none;
  }
  .n1 { width: 200px; height: 60px; top: 10%; left: -250px; animation: nubePasar 30s linear infinite; }
  .n2 { width: 150px; height: 45px; top: 25%; left: -200px; animation: nubePasar 40s linear infinite 8s; }
  @keyframes nubePasar {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(100vw + 400px)); }
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .sol   { width: 350px; height: 350px; top: -100px; }
    .rayos { width: 650px; height: 650px; }
  }
  @media (max-width: 480px) {
    .sol   { width: 260px; height: 260px; top: -80px; }
    .rayos { width: 500px; height: 500px; }
    .polen { width: 6px; height: 6px; }
  }
</style>

  <script>
    // =====================================================
    //   ABEJA QUE SIGUE AL MOUSE / DEDO
    // =====================================================
    const abeja = document.getElementById('abeja');

    // Posición actual (suavizada)
    let abejaX = window.innerWidth / 2;
    let abejaY = window.innerHeight / 2;

    // Posición objetivo (donde está el mouse)
    let targetX = abejaX;
    let targetY = abejaY;

    // Para calcular la rotación según el movimiento
    let ultimaX = abejaX;
    let ultimaY = abejaY;

    // Factor de suavidad (más bajo = más suave/lento, más alto = más rápido)
    const SUAVIDAD = 0.09;

    // Movimiento del mouse
    document.addEventListener('mousemove', (e) => {
      targetX = e.clientX;
      targetY = e.clientY;
    });

    // Touch (para móvil)
    document.addEventListener('touchmove', (e) => {
      if (e.touches[0]) {
        targetX = e.touches[0].clientX;
        targetY = e.touches[0].clientY;
      }
    }, { passive: true });

    document.addEventListener('touchstart', (e) => {
      if (e.touches[0]) {
        targetX = e.touches[0].clientX;
        targetY = e.touches[0].clientY;
      }
    }, { passive: true });

    // =====================================================
    //   BUCLE DE ANIMACIÓN
    // =====================================================
    function animarAbeja() {
      // Interpolar posición hacia el objetivo (movimiento suave)
      abejaX += (targetX - abejaX) * SUAVIDAD;
      abejaY += (targetY - abejaY) * SUAVIDAD;

      // Calcular velocidad para la rotación (dirección del movimiento)
      const dx = abejaX - ultimaX;
      const dy = abejaY - ultimaY;
      ultimaX = abejaX;
      ultimaY = abejaY;

      // Calcular ángulo según la dirección
      // Convertimos dx/dy a un ángulo limitado para que la abeja se incline
      let angulo = 0;
      if (Math.abs(dx) > 0.05 || Math.abs(dy) > 0.05) {
        angulo = Math.atan2(dy, dx) * (180 / Math.PI);
        // Limitamos a un rango más natural (la abeja no se pone boca abajo)
        if (angulo > 90) angulo = 90;
        if (angulo < -90) angulo = -90;
        // Suavizamos el ángulo
        angulo = angulo * 0.35;
      }

      // Aplicar transformación: posición + rotación
      // La rotación se aplica después de centrar con translate(-50%, -50%)
      abeja.style.transform = `translate(${abejaX}px, ${abejaY}px) translate(-50%, -50%) rotate(${angulo}deg)`;

      // Hacer que la abeja apunte al lado correcto según dx
      // (el emoji 🐝 mira hacia la izquierda por defecto)
      // Si va a la derecha, lo volteamos con scaleX(-1)
      const direccion = dx > 0 ? -1 : 1;
      // Suavizamos el cambio de dirección también
      const actualScale = parseFloat(abeja.dataset.scale || '1');
      const nuevoScale = actualScale + (direccion - actualScale) * 0.1;
      abeja.dataset.scale = nuevoScale;

      abeja.style.transform = `translate(${abejaX}px, ${abejaY}px) translate(-50%, -50%) rotate(${angulo}deg) scaleX(${nuevoScale})`;

      requestAnimationFrame(animarAbeja);
    }

    // Iniciar
    animarAbeja();

    // =====================================================
    //   PEQUEÑO EFECTO: chispas al hacer clic
    // =====================================================
    document.addEventListener('click', (e) => {
      for (let i = 0; i < 6; i++) {
        crearChispa(e.clientX, e.clientY);
      }
    });

    function crearChispa(x, y) {
      const chispa = document.createElement('div');
      chispa.style.cssText = `
        position: fixed;
        top: ${y}px;
        left: ${x}px;
        width: 6px;
        height: 6px;
        background: radial-gradient(circle, #fffde0 0%, #ffd54a 50%, transparent 100%);
        border-radius: 50%;
        box-shadow: 0 0 10px #ffd54a, 0 0 20px rgba(255,180,0,0.8);
        pointer-events: none;
        z-index: 200;
        transform: translate(-50%, -50%);
        transition: all 0.8s ease-out;
      `;
      document.body.appendChild(chispa);

      const angulo = Math.random() * Math.PI * 2;
      const distancia = 40 + Math.random() * 60;
      const dx = Math.cos(angulo) * distancia;
      const dy = Math.sin(angulo) * distancia;

      requestAnimationFrame(() => {
        chispa.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`;
        chispa.style.opacity = '0';
      });

      setTimeout(() => chispa.remove(), 900);
    }
  </script>

</body>
